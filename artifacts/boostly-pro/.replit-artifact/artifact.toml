kind = "web"
previewPath = "/"
title = "Boostly Pro"
description = "An organic social media marketing platform for managing services, engagement campaigns, orders, subscriptions, wallet activity, provider connections, support, and administrative operations."
version = "1.0.0"
id = "artifacts/boostly-pro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21544

[services.development]
run = "pnpm --filter @workspace/boostly-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/boostly-pro", "run", "build" ]
serve = "static"
publicDir = "artifacts/boostly-pro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21544"
BASE_PATH = "/"
